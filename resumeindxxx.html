<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Kaand 🔥</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -20%,#ff3b3b22,#000 60%),#050505;color:#fff;font-family:'Space Grotesk',sans-serif;display:flex;justify-content:center;padding:24px}
.wrap{width:100%;max-width:720px}
.badge{display:inline-block;background:#ff3b3b;color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:1px}
h1{font-size:54px;line-height:0.9;margin:18px 0 10px 0;letter-spacing:-2px}
h1 span{color:#ff3b3b}
.sub{color:#888;font-size:16px;margin-bottom:28px}
.card{background:linear-gradient(180deg,#151515,#0f0f0f);border:1px solid #222;border-radius:24px;padding:22px;box-shadow:0 20px 80px #000}
.label{font-size:13px;color:#aaa;letter-spacing:1px;margin-bottom:10px}
textarea{width:100%;height:200px;background:#080808;border:1px solid #222;border-radius:16px;color:#fff;padding:16px;font-size:14px;resize:none;outline:none}
textarea:focus{border-color:#ff3b3b}
.btn{width:100%;margin-top:14px;background:#fff;color:#000;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:17px;cursor:pointer}
.btn:hover{background:#ff3b3b;color:#fff}
.result{margin-top:20px;display:none}
.box{background:#000;border:1px solid #1f1f1f;border-radius:16px;padding:16px;margin-top:12px}
.box h3{margin:0 0 8px 0;font-size:14px}
.roast h3{color:#ff3b3b} .score h3{color:#ffcc00} .fixed h3{color:#00ff88}
p{margin:0;color:#ccc;line-height:1.5;font-size:14px}
.scoreBig{font-size:38px;font-weight:800;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<div class="badge">🔥 VIRAL TOOL • BUILT FOR DEVS</div>
<h1>Resume <span>Kaand.</span></h1>
<div class="sub">Your resume will be roasted first, then fixed. Get embarrassed by AI before HR does.</div>

<div class="card">
<div class="label">PASTE YOUR RESUME HERE</div>
<textarea id="resume" placeholder="Ex: I am a hardworking and passionate student seeking opportunities..."></textarea>
<button class="btn" onclick="roast()">ROAST MY RESUME →</button>

<div class="result" id="result">
<div class="box roast"><h3>💀 ROAST</h3><p id="roastText"></p></div>
<div class="box score"><h3>📊 ATS SCORE</h3><div class="scoreBig" id="scoreText"></div><p id="reasonText"></p></div>
<div class="box fixed"><h3>✅ FIXED VERSION</h3><p id="fixedText"></p></div>
</div>
</div>
</div>

<script>
const API_KEY = "PASTE_YOUR_API_KEY_HERE";

async function roast(){
 let t=document.getElementById('resume').value;
 if(!t){alert('Paste your resume first!');return;}
 let btn=document.querySelector('.btn');
 btn.innerText="ROASTING... 🔥"; btn.disabled=true;
 document.getElementById('result').style.display='block';
 document.getElementById('roastText').innerText="AI is analyzing how bad it is...";
 
 try {
  let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
   method: 'POST',
   headers: {'Content-Type': 'application/json'},
   body: JSON.stringify({
    contents: [{parts: [{text: `You are a savage senior recruiter. Roast this resume brutally in English (2 lines), then give ATS score 0-100 with reason, then give 3 fixed bullet points with numbers and impact. Resume: ${t}. Format clearly: ROAST: ... SCORE: ... FIXED: ... `}]}]
   })
  });
  let data = await res.json();
  let text = data.candidates[0].content.parts[0].text;
  document.getElementById('roastText').innerText = text;
  document.getElementById('scoreText').innerText = "Analyzed by AI";
  document.getElementById('reasonText').innerText = "";
  document.getElementById('fixedText').innerText = "";
 } catch(e){
  document.getElementById('roastText').innerText="Invalid API Key or Network Error. Check your Gemini API key!";
 }
 btn.innerText="ROAST MY RESUME →"; btn.disabled=false;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script>
</body>
</html>
